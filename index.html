<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#100c18"><title>O que ainda floresce • Para Gaby</title><style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap');
:root{--bg:#0d0b13;--surface:#1a1422;--surface2:#251a30;--ink:#fff4f7;--sub:#d4bfcc;--rose:#f5a5bd;--gold:#e9c69b;--stroke:#ffffff24;--glow:#f5a5bd26}body.light{--bg:#f7eaf0;--surface:#fff8fa;--surface2:#f1dfe9;--ink:#382334;--sub:#71596b;--rose:#a83867;--gold:#a06b39;--stroke:#56364b29;--glow:#a838671f}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans',sans-serif;min-height:100vh;transition:background .4s,color .4s}body:before{content:'';position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 80% 10%,var(--glow),transparent 48%),radial-gradient(ellipse at 5% 85%,#9e6e9c15,transparent 48%)}button,input,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--rose);outline-offset:3px}.top{position:sticky;top:0;z-index:10;backdrop-filter:blur(16px);background:color-mix(in srgb,var(--bg) 85%,transparent);border-bottom:1px solid var(--stroke)}.topin{max-width:920px;margin:auto;display:flex;align-items:center;justify-content:space-between;padding:13px 18px;gap:10px}.brand{font-family:'Playfair Display',serif;color:var(--rose);font-size:19px}.pill{border:1px solid var(--stroke);background:var(--surface);color:var(--ink);border-radius:30px;padding:9px 13px}.shell{max-width:820px;margin:auto;padding:30px 18px 85px}.progress{height:5px;background:var(--surface2);border-radius:9px;overflow:hidden;margin:14px 0 30px}.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--rose),var(--gold));transition:width .6s}.eyebrow{text-transform:uppercase;letter-spacing:3px;font-size:11px;font-weight:700;color:var(--rose)}h1,h2,h3{font-family:'Playfair Display',serif;font-weight:600;line-height:1.16}h1{font-size:clamp(40px,8vw,76px);margin:14px 0}h2{font-size:clamp(30px,6vw,49px);margin:10px 0 20px}h3{font-size:25px;margin:8px 0 13px}p{line-height:1.85;color:var(--sub);font-size:16px}strong{color:var(--ink)}.center{text-align:center}.card{background:linear-gradient(145deg,var(--surface),var(--surface2));border:1px solid var(--stroke);border-radius:24px;padding:clamp(22px,5vw,39px);box-shadow:0 20px 60px #00000018}.chapter{animation:appear .65s both}@keyframes appear{from{opacity:0;transform:translateY(17px)}to{opacity:1;transform:translateY(0)}}.hidden{display:none!important}.btn{border:0;border-radius:100px;background:var(--rose);color:#2a1320;font-weight:700;padding:15px 24px;transition:transform .2s,filter .2s}.btn:hover{transform:translateY(-2px);filter:brightness(1.07)}.btn.secondary{background:transparent;border:1px solid var(--stroke);color:var(--ink)}.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:25px}.quote{font-family:'Playfair Display',serif;font-size:clamp(22px,4vw,34px);line-height:1.5;color:var(--ink);margin:24px 0}.spark{font-size:65px;margin:25px 0;filter:drop-shadow(0 0 18px var(--glow))}.choicegrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:22px}.choice{min-height:100px;text-align:left;border:1px solid var(--stroke);background:var(--surface2);color:var(--ink);padding:19px;border-radius:17px;transition:.2s}.choice:hover,.choice.selected{border-color:var(--rose);transform:translateY(-2px)}.choice small{display:block;color:var(--sub);margin-top:8px;line-height:1.5}.reveal{margin-top:20px;padding:20px;border-radius:18px;background:var(--glow);border:1px solid var(--stroke);animation:appear .5s both}.dots{display:flex;gap:8px;justify-content:center;margin:24px 0}.dot{height:9px;width:9px;border-radius:50%;background:var(--stroke)}.dot.on{background:var(--rose)}.memory{padding:16px 20px;border-left:2px solid var(--rose);margin:15px 0;color:var(--sub);line-height:1.7}.wordgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}.word{border:1px solid var(--stroke);border-radius:15px;background:var(--surface2);color:var(--ink);padding:17px 5px}.word.found{background:var(--glow);border-color:var(--rose)}.letter{min-height:130px;white-space:pre-line}.rings{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:26px 0}.rings figure{margin:0;background:var(--surface2);padding:8px;border-radius:18px;border:1px solid var(--stroke)}.rings img{width:100%;height:clamp(180px,43vw,340px);object-fit:cover;border-radius:12px;display:block}.rings figcaption{text-align:center;padding:11px 3px;color:var(--sub);font-size:13px}label{display:block;margin:18px 0 7px;color:var(--ink);font-weight:600}textarea,input{width:100%;background:var(--surface2);border:1px solid var(--stroke);border-radius:14px;padding:15px;color:var(--ink);resize:vertical}textarea{min-height:92px}small.note{color:var(--sub);display:block;margin-top:14px;line-height:1.7}.heart{position:fixed;pointer-events:none;z-index:100;animation:float 1.7s forwards;font-size:21px}@keyframes float{to{transform:translateY(-130px) rotate(25deg);opacity:0}}.divider{height:1px;background:var(--stroke);margin:27px 0}.count{font-size:clamp(24px,5vw,36px);color:var(--rose);font-family:'Playfair Display',serif}.footer{text-align:center;color:var(--sub);font-size:12px;margin-top:50px}@media(max-width:500px){.choicegrid{grid-template-columns:1fr}.rings{gap:8px}.card{border-radius:19px}.topin{padding:10px 14px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style></head><body><header class="top"><div class="topin"><span class="brand">✧ O que ainda floresce</span><div><button class="pill" id="sound" aria-label="Alternar sons">♫ sons: não</button> <button class="pill" id="theme">☾ tema</button></div></div></header><main class="shell"><div class="eyebrow center" id="chapterLabel">Uma experiência feita para Gaby</div><div class="progress"><span id="bar" style="width:0%"></span></div><section class="chapter" id="scene"></section><div class="footer">Feito com carinho, sem exigir respostas perfeitas. ♡</div></main><script>
const scene=document.querySelector('#scene'),bar=document.querySelector('#bar'),chapterLabel=document.querySelector('#chapterLabel');let stage=Number(sessionStorage.getItem('gabyStage')||0),sound=false,audio,wordSet=new Set(),answers=[];const total=9;function save(){sessionStorage.setItem('gabyStage',stage)}function btn(label,fn,secondary=false){const b=document.createElement('button');b.className='btn'+(secondary?' secondary':'');b.textContent=label;b.onclick=fn;return b}function act(...buttons){const a=document.createElement('div');a.className='actions';buttons.forEach(b=>a.append(b));return a}function go(n){stage=Math.max(0,Math.min(total-1,n));save();render();scrollTo({top:0,behavior:'smooth'});chime()}function next(){go(stage+1)}function back(){go(stage-1)}function mount(html){scene.innerHTML=html;scene.classList.remove('chapter');void scene.offsetWidth;scene.classList.add('chapter')}function controls(nextLabel='Continuar'){scene.append(act(...(stage>0?[btn('← Voltar',back,true)]:[]),btn(nextLabel,next)))}function chime(){if(!sound)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.setValueAtTime(523,audio.currentTime);o.frequency.exponentialRampToValueAtTime(784,audio.currentTime+.15);g.gain.setValueAtTime(.035,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.35);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+.36)}catch(e){}}document.querySelector('#sound').onclick=()=>{sound=!sound;document.querySelector('#sound').textContent='♫ sons: '+(sound?'sim':'não');chime()};document.querySelector('#theme').onclick=()=>document.body.classList.toggle('light');function celebrate(){for(let i=0;i<22;i++)setTimeout(()=>{let e=document.createElement('span');e.className='heart';e.textContent=['♡','✦','♥'][i%3];e.style.left=(10+Math.random()*80)+'vw';e.style.top=(45+Math.random()*45)+'vh';e.style.color='var(--rose)';document.body.append(e);setTimeout(()=>e.remove(),1800)},i*75)}
function render(){bar.style.width=(stage/(total-1)*100)+'%';chapterLabel.textContent=['Prólogo • Só nós dois','Capítulo I • Quando o silêncio cresceu','Capítulo II • O que ficou guardado','Capítulo III • Aprender de novo','Capítulo IV • O caminho de volta','Capítulo V • Pequenas descobertas','Capítulo VI • Uma carta sem pressa','Capítulo VII • Duas alianças','Epílogo • Sua voz importa'][stage];if(stage===0){let days=Math.floor((new Date().setHours(12,0,0,0)-new Date(2026,0,4,12))/86400000);mount(`<div class="card center"><div class="spark">✧ ♡ ✧</div><div class="eyebrow">Gaby, isso é para você</div><h1>Nem toda história bonita é fácil.</h1><p>Algumas histórias ficam bonitas porque duas pessoas escolhem aprender, mesmo quando o caminho pesa.</p><p>Este não é um pedido para esquecer o que doeu. É um lugar para olhar com carinho para o que vivemos — e imaginar como podemos cuidar melhor um do outro.</p><div class="divider"></div><div class="count">${Math.max(0,days)} dias</div><p>desde 04 de janeiro de 2026. E ainda há tanta coisa para descobrir.</p><p><strong>Você pode seguir no seu ritmo. Não existe resposta certa.</strong></p></div>`);controls('Abrir nossa história →')}
if(stage===1){mount(`<div class="card"><div class="eyebrow">O primeiro portal</div><h2>Teve um tempo em que quase nos perdemos.</h2><p>O afastamento não aconteceu de uma hora para outra. Às vezes, a gente estava perto na vontade e longe nas palavras. Tínhamos saudade, mas também cansaço. Queríamos carinho, mas nem sempre sabíamos pedir.</p><div class="quote">“Eu tive medo de que o silêncio fosse maior que tudo o que sentimos.”</div><p>Eu não quero transformar nossas dificuldades em culpa. Quero entender o que machucou, reconhecer minhas atitudes e aprender a te ouvir de verdade.</p><div class="memory">O nosso desafio aqui não é fingir que nunca brigamos. É descobrir como conversar sem nos ferir.</div></div>`);controls('Atravessei esse capítulo')}
if(stage===2){mount(`<div class="card"><div class="eyebrow">Minijogo 1 • Abra as três janelas</div><h2>O que eu nem sempre consegui dizer</h2><p>Toque nas três caixinhas. Cada uma guarda um sentimento que esteve conosco.</p><div class="choicegrid" id="windows"></div><div id="winMsg" class="reveal hidden"></div><div id="winDone"></div></div>`);const data=[['O medo','Eu tive medo de te perder. Mas quero que o meu medo nunca mais fale mais alto que o meu respeito pela sua liberdade.'],['O cansaço','Teve dia em que nós dois estávamos esgotados. Eu quero aprender a ser abrigo, não mais uma cobrança.'],['A saudade','Mesmo quando a conversa foi pouca, senti falta da nossa leveza, das risadas e de estar com você sem precisar resolver tudo.']];let seen=new Set();data.forEach(([t,m],i)=>{let b=document.createElement('button');b.className='choice';b.innerHTML=`<strong>0${i+1} · ${t}</strong><small>Toque para revelar</small>`;b.onclick=()=>{seen.add(i);b.classList.add('selected');let box=document.querySelector('#winMsg');box.classList.remove('hidden');box.textContent=m;chime();if(seen.size===3&&!document.querySelector('#winDone button'))document.querySelector('#winDone').append(act(btn('Guardar o que aprendemos →',next)))};document.querySelector('#windows').append(b)});scene.append(act(btn('← Voltar',back,true)))}
if(stage===3){mount(`<div class="card"><div class="eyebrow">Minijogo 2 • Escolhas de cuidado</div><h2>Como podemos nos encontrar de novo?</h2><p>Em cada situação, escolha a atitude que gostaria de ver crescer entre nós. Não é uma prova: todas as escolhas são oportunidades de conversar.</p><div id="quiz"></div><div id="quizEnd"></div></div>`);let q=[['Quando um de nós chega cansado…',['Dar espaço e perguntar como ajudar','Insistir em resolver tudo na hora']],['Quando alguma coisa machuca…',['Conversar com calma e ouvir até o fim','Guardar tudo até explodir']],['Quando o medo aparece…',['Falar com sinceridade sem acusar','Transformar insegurança em cobrança']]];let idx=0;function question(){if(idx===q.length){document.querySelector('#quiz').innerHTML='<div class="reveal"><strong>O nosso acerto não precisa ser perfeito.</strong><p>O que importa é tentar agir com mais carinho, reparar quando erramos e respeitar os limites um do outro.</p></div>';document.querySelector('#quizEnd').append(act(btn('Seguir para a próxima descoberta →',next)));return}let [t,opts]=q[idx];document.querySelector('#quiz').innerHTML=`<div class="dots">${q.map((_,i)=>`<span class="dot ${i<=idx?'on':''}"></span>`).join('')}</div><h3>${t}</h3><div class="choicegrid" id="options"></div>`;opts.forEach((op,i)=>{let b=document.createElement('button');b.className='choice';b.textContent=op;b.onclick=()=>{answers.push(op);document.querySelector('#quiz').innerHTML=`<div class="reveal"><strong>${i===0?'Um jeito gentil de tentar.':'Um sentimento que vale conversar.'}</strong><p>Quando estamos cansados ou magoados, nem sempre fazemos a melhor escolha. Podemos aprender a reparar isso juntos.</p></div>`;document.querySelector('#quizEnd').replaceChildren(act(btn('Próxima situação →',()=>{idx++;document.querySelector('#quizEnd').replaceChildren();question()})))};document.querySelector('#options').append(b)})}question();scene.append(act(btn('← Voltar',back,true)))}
if(stage===4){mount(`<div class="card"><div class="eyebrow">Minijogo 3 • Monte nosso recomeço</div><h2>Seis palavras, um novo jeito de amar.</h2><p>Encontre as seis palavras que merecem mais espaço no nosso relacionamento.</p><div class="wordgrid" id="words"></div><div id="wordMessage" class="reveal hidden"></div><div id="wordEnd"></div></div>`);let words=['Escuta','Respeito','Leveza','Carinho','Coragem','Paciência'];wordSet=new Set();words.forEach(w=>{let b=document.createElement('button');b.className='word';b.textContent=w;b.onclick=()=>{wordSet.add(w);b.classList.add('found');chime();document.querySelector('#wordMessage').classList.remove('hidden');document.querySelector('#wordMessage').textContent=`${wordSet.size} de 6 descobertas. Cada palavra é um compromisso possível, não uma obrigação de ser perfeito.`;if(wordSet.size===6&&!document.querySelector('#wordEnd button')){document.querySelector('#wordMessage').innerHTML='<strong>Nosso recomeço:</strong> mais escuta, respeito, leveza, carinho, coragem e paciência.';document.querySelector('#wordEnd').append(act(btn('Abrir a próxima porta →',next)))}};document.querySelector('#words').append(b)});scene.append(act(btn('← Voltar',back,true)))}
if(stage===5){mount(`<div class="card"><div class="eyebrow">Pequenas descobertas</div><h2>Quero conhecer cada versão sua.</h2><p>Eu amo nossas conversas sem roteiro, as brincadeiras, os momentos em que você se solta e pode ser você mesma. Não quero um relacionamento em que você precise acertar sempre ou esconder sentimentos para me agradar.</p><p>Quero que a gente tenha liberdade para falar, rir, descansar, discordar com respeito e descobrir coisas novas juntos. Que você se sinta segura para dizer <strong>“hoje não estou bem”</strong>, sem medo de me decepcionar.</p><div class="quote">“O amor que eu quero construir com você não te prende. Ele te acolhe.”</div><p>Não existe relacionamento perfeito. Existe um relacionamento que pode ficar mais honesto, mais leve e mais nosso.</p></div>`);controls('Ler uma carta só sua →')}
if(stage===6){mount(`<div class="card"><div class="eyebrow">Uma carta escrita em partes</div><h2>Gaby, ainda escolho aprender com você.</h2><p>Toque em cada trecho para ler no seu tempo.</p><div class="choicegrid" id="letters"></div><div class="reveal letter" id="letterText">Cada envelope guarda uma parte do meu coração.</div><div id="letterEnd"></div></div>`);let parts=[['Pelas nossas brigas','Eu sinto muito pelas vezes em que deixei inseguranças, insistência ou cansaço atrapalharem a forma como te tratei. Quero reconhecer meus erros sem colocar em você a obrigação de consertá-los.'],['Pelos nossos dias difíceis','Eu sei que a rotina pesa, que nem sempre conseguimos ficar juntos como queríamos e que você também enfrenta dias difíceis. Quero respeitar o seu tempo e cuidar do nosso vínculo sem pressionar.'],['Pelos nossos melhores momentos','Eu guardo com carinho nossas risadas, nossos momentos de oração, as conversas em que nos entendemos e a sensação boa de estar do seu lado, mesmo de longe.'],['Pelo que ainda sonhamos','Eu sonho com um futuro ao seu lado, com uma casa cheia de amor e, quem sabe, nossa família. Mas quero que esse futuro seja construído com escolhas livres, confiança e alegria para nós dois.']];let seen=new Set();parts.forEach(([t,m],i)=>{let b=document.createElement('button');b.className='choice';b.innerHTML=`<strong>✉ ${t}</strong><small>Abrir envelope</small>`;b.onclick=()=>{seen.add(i);b.classList.add('selected');document.querySelector('#letterText').textContent=m;chime();if(seen.size===4&&!document.querySelector('#letterEnd button'))document.querySelector('#letterEnd').append(act(btn('Chegar à nossa promessa →',next)))};document.querySelector('#letters').append(b)});scene.append(act(btn('← Voltar',back,true)))}
if(stage===7){mount(`<div class="card center"><div class="eyebrow">O último segredo</div><h2>Dois anéis. Uma história que continua.</h2><p>Essas duas imagens guardam um detalhe nosso. Não são uma promessa de que nunca teremos dias difíceis — são um lembrete de que podemos escolher conversar, mudar e cuidar melhor do que sentimos.</p><div class="rings"><figure><img src="anel_rafa.jpg" alt="Fotografia da aliança em uma mão" loading="eager"><figcaption>O meu anel ♡</figcaption></figure><figure><img src="anel_gaby.jpg" alt="Fotografia da aliança em uma mão com unhas decoradas" loading="eager"><figcaption>O seu anel ♡</figcaption></figure></div><div class="quote">“Eu não quero vencer as nossas discussões. Quero que nós dois sejamos ouvidos.”</div><p>Gaby, obrigado pelos momentos bons, pela coragem de atravessar os difíceis e por tudo que ainda podemos descobrir. Você não precisa responder com as palavras que eu espero. Quero conhecer o que você sente de verdade.</p><p><strong>O final desta aventura não é uma resposta pronta. É a sua voz.</strong></p></div>`);celebrate();controls('Abrir um espaço só seu →')}
if(stage===8){mount(`<div class="card"><div class="eyebrow">Um lugar seguro para ser sincera</div><h2>Agora eu quero te ouvir, Gaby.</h2><p>Você pode escrever o que quiser, inclusive o que for difícil de dizer. Não existe resposta certa, e você não precisa preencher tudo. A mensagem só será enviada se você decidir compartilhar.</p><form id="feelings"><label for="feel">Como você tem se sentido ultimamente?</label><textarea id="feel" placeholder="Pode escrever do seu jeito…"></textarea><label for="hurt">O que tem te deixado chateada ou magoada?</label><textarea id="hurt" placeholder="Eu quero entender…"></textarea><label for="change">O que você gostaria que mudasse entre nós?</label><textarea id="change" placeholder="Uma coisa de cada vez…"></textarea><label for="good">O que você mais gosta em nós e quer preservar?</label><textarea id="good" placeholder="Nossas pequenas alegrias…"></textarea><label for="other">Tem algo mais que gostaria de me contar?</label><textarea id="other" placeholder="Este espaço é seu…"></textarea><div class="actions"><button type="button" class="btn secondary" id="copy">Copiar minha mensagem</button><button type="button" class="btn" id="share">Compartilhar minha mensagem ♡</button></div><small class="note" id="status">Nada é enviado automaticamente. Ao compartilhar, você escolhe o aplicativo e a pessoa que receberá a mensagem. Você pode também copiar o texto.</small></form><div class="divider"></div><div class="center"><div class="quote">“Eu te amo, mas também quero aprender a te amar melhor.”</div><p>Com carinho, de alguém que ainda quer construir bons capítulos com você.</p></div></div>`);function message(){let fields=[['Como estou me sentindo','feel'],['O que me deixa chateada','hurt'],['O que gostaria que mudasse','change'],['O que quero preservar','good'],['Mais alguma coisa','other']];return '💌 Minha mensagem sobre nós\n\n'+fields.map(([label,id])=>`${label}:\n${document.getElementById(id).value.trim()||'(prefiro não responder)'}`).join('\n\n')}document.querySelector('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(message());document.querySelector('#status').textContent='Mensagem copiada! Agora você pode colar na conversa que escolher.'}catch(e){let t=document.createElement('textarea');t.value=message();document.body.append(t);t.select();document.execCommand('copy');t.remove();document.querySelector('#status').textContent='Mensagem preparada para copiar.'}};document.querySelector('#share').onclick=async()=>{const text=message();if(navigator.share){try{await navigator.share({title:'Uma mensagem da Gaby',text});document.querySelector('#status').textContent='Compartilhamento aberto. Obrigado por dividir seus sentimentos.'}catch(e){if(e.name!=='AbortError')document.querySelector('#status').textContent='Não foi possível compartilhar. Use o botão de copiar.'}}else{window.open('https://wa.me/?text='+encodeURIComponent(text),'_blank','noopener');document.querySelector('#status').textContent='Escolha a conversa no WhatsApp e confirme o envio. Se não abrir, copie a mensagem.'}};scene.append(act(btn('← Rever os anéis',back,true),btn('Recomeçar a aventura',()=>go(0),true)))}}
render();
</script></body></html>
